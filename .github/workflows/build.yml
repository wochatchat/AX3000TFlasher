name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ax3000t-flasher-build-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify release keystore
        env:
          AX3000T_KEYSTORE: ${{ github.workspace }}/app/keystore/ax3000t-release.p12
          AX3000T_STORE_PASSWORD: ${{ secrets.AX3000T_STORE_PASSWORD }}
          AX3000T_KEY_ALIAS: ${{ secrets.AX3000T_KEY_ALIAS }}
          AX3000T_KEY_PASSWORD: ${{ secrets.AX3000T_KEY_PASSWORD }}
        run: |
          test -s "$AX3000T_KEYSTORE"
          keytool -list -storetype PKCS12 -keystore "$AX3000T_KEYSTORE" \
            -storepass "$AX3000T_STORE_PASSWORD" -alias "$AX3000T_KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        env:
          AX3000T_KEYSTORE: ${{ github.workspace }}/app/keystore/ax3000t-release.p12
          AX3000T_STORE_PASSWORD: ${{ secrets.AX3000T_STORE_PASSWORD }}
          AX3000T_KEY_ALIAS: ${{ secrets.AX3000T_KEY_ALIAS }}
          AX3000T_KEY_PASSWORD: ${{ secrets.AX3000T_KEY_PASSWORD }}
        run: |
          chmod +x gradlew build.sh
          ./build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AX3000T-Flasher-${{ github.sha }}
          path: |
            apk/ax3000t-flasher-latest.apk
            apk/ax3000t-flasher-latest.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Archive latest signed APK in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: archive signed AX3000T flasher APK [skip ci]"
          git push origin HEAD:main
