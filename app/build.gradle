plugins {
    id 'com.android.application'
}

android {
    namespace 'com.minis.ax3000t'
    compileSdk 35

    def versionPropsFile = rootProject.file('version.properties')
    def versionProps = new Properties()
    if (versionPropsFile.exists()) {
        versionPropsFile.withInputStream { versionProps.load(it) }
    }

    defaultConfig {
        applicationId 'com.minis.ax3000t'
        minSdk 29
        targetSdk 35
        versionCode (versionProps.getProperty('versionCode', '1') as Integer)
        versionName versionProps.getProperty('versionName', '1.0.0')
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('AX3000T_KEYSTORE')
            if (keystorePath != null && !keystorePath.isEmpty()) {
                storeFile file(keystorePath)
                storeType 'pkcs12'
                storePassword System.getenv('AX3000T_STORE_PASSWORD')
                keyAlias System.getenv('AX3000T_KEY_ALIAS')
                keyPassword System.getenv('AX3000T_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            if (System.getenv('AX3000T_KEYSTORE') != null) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.github.mwiede:jsch:0.2.23'
    testImplementation 'junit:junit:4.13.2'
}
